name: Publish npm package
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --input-type=module -e "import p from './package.json' with {type:'json'}; if(p.name !== '@matuto-ai/opencode-broker-connector' || process.env.RELEASE_TAG !== 'v'+p.version) process.exit(1)"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix test/official-cli --ignore-scripts --no-audit --no-fund
      - run: echo '538fcb1b6408c8d4608822acee19f7ff5b3a3eb3383c0633c4f06170857312a7  test/official-cli/node_modules/opencode-linux-x64/bin/opencode' | sha256sum -c -
      - run: npm run check
      - run: npm test
        env:
          OPENCODE_BINARY: ${{ github.workspace }}/test/official-cli/node_modules/opencode-linux-x64/bin/opencode
      - run: npm run pack:check
      - run: npm publish --access public --provenance
